name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install MkDocs Material
        run: pip install -r requirements.txt
      - name: Build site
        run: mkdocs build --strict
        env:
          # Read by hooks/buildstamp.py to render the footer stamp. Passed as an
          # environment variable rather than interpolated into `run:`, so a
          # commit message containing shell metacharacters cannot execute.
          # Empty on workflow_dispatch (no head commit); the hook falls back to
          # the short SHA.
          BUILD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

          # -- GATE KEYS ---------------------------------------------------
          # One line per password group. A page writing `gates: [psm]` makes
          # hooks/visibility.py read URITP_GATE_PSM from this list.
          #
          # SLOTS ARE PRE-WIRED. Every name below is already plumbed through
          # whether or not the secret exists -- an unset secret interpolates to
          # an empty string, and the hook ignores empty values. So standing up
          # a new group is normally just: create the secret in Settings with
          # the matching name, and use it in a page. No edit here.
          #
          # Only a group whose name is NOT on this list needs a line adding,
          # and then it is one line, copied from its neighbour.
          #
          # ⚠️ 2026-08-01: this list REPLACED a `${{ toJSON(secrets) }}` scan
          #    that discovered keys by prefix and needed no list at all. It was
          #    the better design and it is reverted for one blunt reason: the
          #    first run carrying it came back `action_required` with zero jobs
          #    and never deployed. Handing a workflow the whole secrets context
          #    trips an approval gate, and a deploy that waits on a human click
          #    is worse than a list you edit twice a year. Do not reintroduce
          #    toJSON(secrets) without testing it on a branch first.
          URITP_GATE_ADMIN: ${{ secrets.URITP_GATE_ADMIN }}
          URITP_GATE_DEV: ${{ secrets.URITP_GATE_DEV }}
          URITP_GATE_PSM: ${{ secrets.URITP_GATE_PSM }}
          URITP_GATE_DESIGNERS: ${{ secrets.URITP_GATE_DESIGNERS }}
          URITP_GATE_SUPERVISORS: ${{ secrets.URITP_GATE_SUPERVISORS }}
          URITP_GATE_FACULTY: ${{ secrets.URITP_GATE_FACULTY }}
          URITP_GATE_STUDENTS: ${{ secrets.URITP_GATE_STUDENTS }}
          URITP_GATE_GUESTS: ${{ secrets.URITP_GATE_GUESTS }}
          URITP_GATE_SHOP: ${{ secrets.URITP_GATE_SHOP }}
          URITP_GATE_FOH: ${{ secrets.URITP_GATE_FOH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
