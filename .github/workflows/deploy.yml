name: Build and deploy docs

on:
  push:
    branches: [main]
  # A build-only check on every PR. Added 2026-08-01 after a workflow change
  # went straight to main, came back `action_required` with zero jobs, and
  # stopped the site deploying. A workflow edit cannot be verified by reading
  # it -- this is the only way to see one run before it is the live pipeline.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install MkDocs Material
        run: pip install -r requirements.txt
      - name: Build site
        run: mkdocs build --strict
        env:
          # Read by hooks/buildstamp.py to render the footer stamp. Passed as an
          # environment variable rather than interpolated into `run:`, so a
          # commit message containing shell metacharacters cannot execute.
          # Empty on workflow_dispatch (no head commit); the hook falls back to
          # the short SHA.
          BUILD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

          # ── THE KEYSTORE ────────────────────────────────────────────────
          # ONE secret holds every stable password group, as `name = password`
          # lines. Adding a group is adding a line to that secret's VALUE.
          #
          # 🚫 DO NOT ADD A LINE HERE FOR A NEW GROUP. That is what this
          #    design removed. The list of ten pre-wired slot names that used
          #    to sit here was deleted on 2026-08-01: it made an agent choose
          #    Michael's vocabulary in advance, which was the actual objection.
          #
          # The readable copy of the block lives in the ClickUp Accounts task
          # (linked from AUTHORING.md). A secret cannot be read back, so that
          # task is the master and this is the copy.
          URITP_GATE_KEYS: ${{ secrets.URITP_GATE_KEYS }}

          # ── ROTATION HATCH (rare, deliberate) ───────────────────────────
          # A high-churn group MAY live in its own secret so reissuing it does
          # not mean repasting the whole block. GitHub only hands a workflow
          # the secrets it names, so that ONE group needs a line here:
          #
          #   URITP_GATE_STUDENTS: ${{ secrets.URITP_GATE_STUDENTS }}
          #
          # Uncomment/copy per group, and only when the rotation cost is real.
          # The container wins if a name appears in both, and the build warns.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Never deploy from a PR: the PR job is a build check only.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
