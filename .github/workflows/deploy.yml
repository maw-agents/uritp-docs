name: Build and deploy docs

on:
  push:
    branches: [main]
  # A build-only check on every PR. Added 2026-08-01 after a workflow change
  # went straight to main, came back `action_required` with zero jobs, and
  # stopped the site deploying. A workflow edit cannot be verified by reading
  # it -- this is the only way to see one run before it is the live pipeline.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      # 🔴 NO `--strict` HERE, AND DO NOT PUT IT BACK. REMOVED 2026-08-01.
      #
      # `--strict` promotes ANY warning, from ANY plugin, into a failed build.
      # A failed build does not show an error to a reader: GitHub Pages keeps
      # serving the LAST SUCCESSFUL build, for the whole site, silently. It
      # looks exactly like a cache problem and no amount of reloading fixes it.
      #
      # It fired three times on 2026-08-01 and cost the site hours:
      #   * a page moved and relative .md links went stale
      #   * one rename broke eight links across six files
      #   * `status: public` -> `status: hidden` on ONE page left a stale entry
      #     in docs/.nav.yml, and the site froze over one frontmatter word
      #
      # Both hooks were already written to route AROUND this trade -- read
      # hooks/links.py and hooks/visibility.py, which each argue the case in
      # their docstrings and each say the failure must be LOCAL AND VISIBLE,
      # not global and silent. The repo's stated position and its pipeline
      # disagreed, and the pipeline was winning.
      #
      # This is NOT "stop checking". The build still hard-fails on OUR OWN
      # gates, which fail loudly and by name and are about this site rather
      # than about MkDocs:
      #   hooks/theme.py     a missing/unknown token, palette or theme name
      #   hooks/contrast.py  the ACTIVE palette being unreadable
      # And every degraded case is reported by name in the run summary.
      #
      # Three escape hatches restore hard-fail per concern, when someone wants
      # the whole house clean rather than the site up:
      #   URITP_LINKS_STRICT=1     a dead internal link fails the build
      #   URITP_GATES_STRICT=1     a gated page with no key fails the build
      #   URITP_CONTRAST_STRICT=1  every contrast warning fails the build
      - name: Build site
        run: mkdocs build
        env:
          # Read by hooks/buildstamp.py to render the footer stamp. Passed as an
          # environment variable rather than interpolated into `run:`, so a
          # commit message containing shell metacharacters cannot execute.
          # Empty on workflow_dispatch (no head commit); the hook falls back to
          # the short SHA.
          BUILD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

          # ── THE KEYSTORE ────────────────────────────────────────────────
          # ONE secret holds every stable password group, as `name = password`
          # lines. Adding a group is adding a line to that secret's VALUE.
          #
          # 🚫 DO NOT ADD A LINE HERE FOR A NEW GROUP. That is what this
          #    design removed. The list of ten pre-wired slot names that used
          #    to sit here was deleted on 2026-08-01: it made an agent choose
          #    Michael's vocabulary in advance, which was the actual objection.
          #
          # The readable copy of the block lives in the ClickUp Accounts task
          # (linked from AUTHORING.md). A secret cannot be read back, so that
          # task is the master and this is the copy.
          URITP_GATE_KEYS: ${{ secrets.URITP_GATE_KEYS }}

          # ── ROTATION HATCH (rare, deliberate) ───────────────────────────
          # A high-churn group MAY live in its own secret so reissuing it does
          # not mean repasting the whole block. GitHub only hands a workflow
          # the secrets it names, so that ONE group needs a line here:
          #
          #   URITP_GATE_STUDENTS: ${{ secrets.URITP_GATE_STUDENTS }}
          #
          # Uncomment/copy per group, and only when the rotation cost is real.
          # The container wins if a name appears in both, and the build warns.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Never deploy from a PR: the PR job is a build check only.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
