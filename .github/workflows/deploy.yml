name: Build and deploy docs

on:
  push:
    branches: [main]
  # A build-only check on every PR. Added 2026-08-01 after a workflow change
  # went straight to main, came back `action_required` with zero jobs, and
  # stopped the site deploying. A workflow edit cannot be verified by reading
  # it -- this is the only way to see one run before it is the live pipeline.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      # ══ THE LAW THIS STEP ENFORCES ═════════════════════════════════════
      #
      #   A CONTENT EDIT MUST NEVER BE ABLE TO STOP THE DEPLOY.
      #   Only a CONFIG or CODE error may.
      #
      # 🔴 `mkdocs build --strict` was removed on 2026-08-01 and MUST NOT come
      #    back. It turned every MkDocs WARNING into a site-wide outage, and
      #    the outage is invisible: a failed build means Pages keeps serving
      #    the last successful one, for the whole site, with no signal beyond
      #    a grey X on a commit list. It looks exactly like a cache problem.
      #    It is not one, and no amount of hard-reloading touches it.
      #
      #    It froze this site THREE times in one day:
      #      * a page moved and relative .md paths went stale
      #      * ONE rename broke eight links across six files
      #      * `status: hidden` on a page named in docs/.nav.yml
      #
      #    The third one is the whole argument. That edit was ONE WORD of
      #    frontmatter, made by the only person who edits this site, doing
      #    exactly what the documentation says `hidden` is for. It took the
      #    entire reference site off the air for 24 minutes and the author
      #    could not have known.
      #
      # ⚠️ THE REAL FINDING: this trade had already been REJECTED three times
      #    in three separate places, and `--strict` survived every one of
      #    them because each fix routed around it instead of removing it --
      #      hooks/links.py    a dead link renders as a marker and continues
      #      hooks/visibility.py  a missing gate key locks one page, not the site
      #      AUTHORING-GATES.md   "local and visible beats global and silent"
      #    Every escape hatch in this repo was built around a flag nobody had
      #    thought to delete. Building an exception is not the same as fixing
      #    the rule.
      #
      # WHAT STILL FAILS THE BUILD, deliberately and unchanged:
      #   * mkdocs itself erroring (bad YAML, a plugin that will not load)
      #   * hooks/theme.py    unknown theme, missing token, inherits loop
      #   * hooks/contrast.py the ACTIVE palette failing a contrast floor
      #   * URITP_LINKS_STRICT=1 / URITP_GATES_STRICT=1 if ever set
      # Those are all CODE and CONFIG. None can be caused by writing a page.
      #
      # pipefail is load-bearing: without it the exit code comes from `tee`
      # and this step would pass no matter what mkdocs did.
      - name: Build site
        run: |
          set -o pipefail
          mkdocs build 2>&1 | tee build.log
        env:
          # Read by hooks/buildstamp.py to render the footer stamp. Passed as an
          # environment variable rather than interpolated into `run:`, so a
          # commit message containing shell metacharacters cannot execute.
          # Empty on workflow_dispatch (no head commit); the hook falls back to
          # the short SHA.
          BUILD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

          # ── THE KEYSTORE ────────────────────────────────────────────────
          # ONE secret holds every stable password group, as `name = password`
          # lines. Adding a group is adding a line to that secret's VALUE.
          #
          # 🚫 DO NOT ADD A LINE HERE FOR A NEW GROUP. That is what this
          #    design removed. The list of ten pre-wired slot names that used
          #    to sit here was deleted on 2026-08-01: it made an agent choose
          #    Michael's vocabulary in advance, which was the actual objection.
          #
          # The readable copy of the block lives in the ClickUp Accounts task
          # (linked from AUTHORING.md). A secret cannot be read back, so that
          # task is the master and this is the copy.
          URITP_GATE_KEYS: ${{ secrets.URITP_GATE_KEYS }}

          # ── ROTATION HATCH (rare, deliberate) ───────────────────────────
          # A high-churn group MAY live in its own secret so reissuing it does
          # not mean repasting the whole block. GitHub only hands a workflow
          # the secrets it names, so that ONE group needs a line here:
          #
          #   URITP_GATE_STUDENTS: ${{ secrets.URITP_GATE_STUDENTS }}
          #
          # Uncomment/copy per group, and only when the rotation cost is real.
          # The container wins if a name appears in both, and the build warns.

      # Not failing the build only works if the problem does not become
      # invisible instead. Warnings that used to kill the deploy now land in
      # the run summary, where they can be read without stopping anyone's day.
      # `if: always()` so they still surface when the build DID fail -- that is
      # exactly when you most want to see them.
      - name: Surface build warnings
        if: always()
        run: |
          if [ -f build.log ] && grep -q 'WARNING' build.log; then
            {
              echo '### ⚠️ Build warnings'
              echo
              echo 'These did **not** stop the deploy, and they are not supposed to.'
              echo 'Read them anyway: a warning here is usually a link, a nav entry'
              echo 'or a status value that no longer points at anything.'
              echo
              echo '```'
              grep 'WARNING' build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Never deploy from a PR: the PR job is a build check only.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
