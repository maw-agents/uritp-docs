name: Build and deploy docs

on:
  push:
    branches: [main]
  # A build-only check on every PR. Added 2026-08-01 after a workflow change
  # went straight to main, came back `action_required` with zero jobs, and
  # stopped the site deploying. A workflow edit cannot be verified by reading
  # it -- this is the only way to see one run before it is the live pipeline.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      # 🔴 NO `--strict` HERE, AND DO NOT PUT IT BACK. READ THIS FIRST.
      #
      # `--strict` turns ANY warning, from ANY plugin, into a failed build. A
      # failed build does not show an error to a reader: the deploy job is
      # SKIPPED and GitHub Pages keeps serving the last successful commit, for
      # the WHOLE SITE, with no signal anywhere a page author would look. It
      # presents as a caching problem. It is not one, and no amount of hard
      # reloading touches it.
      #
      # It cost the site three times on 2026-08-01:
      #   * a page move stale-ing relative .md links (twice, inside 40 minutes)
      #   * `status: public` -> `status: hidden` on one page that docs/.nav.yml
      #     names by filename. One word of frontmatter, in the web editor, by
      #     the only person who edits this site. 24 minutes stale, and the only
      #     signal was a grey X on a commit list.
      #
      # Both of this repo's own hooks were BUILT to route around it and say so
      # in their docstrings -- hooks/links.py ("this hook deliberately takes
      # the opposite stance to --strict... one typo must never again freeze an
      # entire reference site") and hooks/visibility.py ("the same trade
      # --strict used to make over a single dead link, rejected for the same
      # reason"). The reasoning shipped and this line did not, so the pipeline
      # kept overruling the design. Removed 2026-08-01, Michael: "I NEED this
      # whole tree and build to be a LOT more robust."
      #
      # WHAT REPLACED IT, because this is not "stop checking":
      #   * hooks/links.py     reports dead links, fragile anchors and legacy
      #                        paths by name, and renders a visible marker
      #   * hooks/visibility.py reports an unrecognised `status:` value, pages
      #                        hidden only by default, and every hide that
      #                        orphaned an inbound link
      #   * hooks/contrast.py  fails the build on the ACTIVE palette only
      # Every one of those is local and by name. The failure a build should
      # refuse is a failure in OUR data, not a warning from someone's plugin.
      #
      # To reproduce the old behaviour for one run without editing this file:
      # run the workflow manually and set URITP_LINKS_STRICT / URITP_GATES_STRICT.
      - name: Build site
        run: mkdocs build
        env:
          # Read by hooks/buildstamp.py to render the footer stamp. Passed as an
          # environment variable rather than interpolated into `run:`, so a
          # commit message containing shell metacharacters cannot execute.
          # Empty on workflow_dispatch (no head commit); the hook falls back to
          # the short SHA.
          BUILD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

          # ── THE KEYSTORE ────────────────────────────────────────────────
          # ONE secret holds every stable password group, as `name = password`
          # lines. Adding a group is adding a line to that secret's VALUE.
          #
          # 🚫 DO NOT ADD A LINE HERE FOR A NEW GROUP. That is what this
          #    design removed. The list of ten pre-wired slot names that used
          #    to sit here was deleted on 2026-08-01: it made an agent choose
          #    Michael's vocabulary in advance, which was the actual objection.
          #
          # The readable copy of the block lives in the ClickUp Accounts task
          # (linked from AUTHORING.md). A secret cannot be read back, so that
          # task is the master and this is the copy.
          URITP_GATE_KEYS: ${{ secrets.URITP_GATE_KEYS }}

          # ── ROTATION HATCH (rare, deliberate) ───────────────────────────
          # A high-churn group MAY live in its own secret so reissuing it does
          # not mean repasting the whole block. GitHub only hands a workflow
          # the secrets it names, so that ONE group needs a line here:
          #
          #   URITP_GATE_STUDENTS: ${{ secrets.URITP_GATE_STUDENTS }}
          #
          # Uncomment/copy per group, and only when the rotation cost is real.
          # The container wins if a name appears in both, and the build warns.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Never deploy from a PR: the PR job is a build check only.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
