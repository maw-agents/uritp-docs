# THEME: everything about the look lives in the `theme/` folder as TSV grids.
#   Swap the whole site by editing ONE WORD in theme/active.txt. Nudge one
#   value by editing ONE CELL in the matching grid. Start at theme/README.md.
#   NOTHING about colour, type, edges or density is set in this file.
#   (theme.yml is a retired stub as of 2026-08-01 and is read by nothing.)
# NAVIGATION: generated from the file tree. Order lives in docs/.nav.yml.
# VISIBILITY: every page needs `status:` in its frontmatter or it will not build.
# LINKS: internal links are ids, not paths. See hooks/links.py + AUTHORING.md.
#
# POINTER: adding or removing a markdown_extension changes what page authors can
#   write, and changing hooks/visibility.py changes what publishes. Update
#   AUTHORING.md in the SAME PR or it teaches rules the build no longer follows.

site_name: URITP PRP
site_url: https://maw-agents.github.io/uritp-docs/

# repo_url STAYS even though the GitHub block is hidden in the chrome (see
# uritp.css -> CHROME). MkDocs builds `page.edit_url` from repo_url + edit_uri,
# and hooks/pagefoot.py renders that at the bottom of every page. Delete this
# line and the edit link silently disappears from the whole site.
repo_url: https://github.com/maw-agents/uritp-docs
edit_uri: edit/main/docs/
copyright: URITP | MAW

theme:
  name: material

  # ⚠️ NO `font:` BLOCK HERE ON PURPOSE, AND DO NOT ADD ONE BACK.
  #
  # hooks/theme.py SETS `theme.font` at build time from the `webfont-text` and
  # `webfont-code` columns of the active row in theme/typography.tsv. That is
  # the same row that decides which family the CSS asks for, so the family we
  # DOWNLOAD and the family we ASK FOR can no longer disagree.
  #
  # This closes a seam that was documented for weeks as unclosable: two files
  # naming the same font, kept in agreement by hand, where a mismatch produced
  # a silent fallback to the next entry in the stack with no error anywhere.
  # A `font:` block written here would be overwritten on every build, so it
  # would read as configuration while doing nothing at all.

  # 🔴 NO `primary:` KEY HERE EITHER, AND THIS ONE IS A TRAP. DO NOT ADD IT.
  #
  # `primary: black` sat here until 2026-08-01 and it was silently DEFEATING
  # the `chrome` colour token. Material special-cases black in
  # palette/_primary.scss: instead of only setting `--md-primary-fg-color`
  # (which our bridge overrides), it writes a LITERAL background on the
  # component --
  #
  #     [data-md-color-primary=black] .md-header { background-color: ... }
  #     html & .md-nav--primary .md-nav__title[for=__drawer] { ... }
  #     .md-tabs { background-color: ... }
  #
  # -- so no variable could reach the header at all. The banner was hard black
  # in BOTH modes. Nobody caught it in dark mode because black is close enough
  # to our dark `bg`; in light mode the background stayed black while
  # `--md-primary-bg-color` (which we DO control) flipped the text to the
  # light-mode `on-chrome`, giving dark-brown text on a black bar. Michael,
  # 2026-08-01: "the header didn't render well in light mode... it kept banner
  # color but swapped color text."
  #
  # ⚠️ AND THE REASON THIS KEY WAS KEPT WAS FALSE. It was documented here as
  # the source of the phone browser's <meta name="theme-color">. It is not.
  # Material's palette component reads the HEADER'S COMPUTED BACKGROUND
  # (assets/javascripts/components/palette/index.ts: getComputedStyle(header)
  # .backgroundColor) and writes that into the meta tag on every scheme
  # change. So with this key GONE, the phone's browser bar now tracks the
  # `chrome` token per mode, for free, which is what we wanted all along.
  #
  # With no `primary`, no `[data-md-color-primary=...]` rule matches, and
  # Material's own default applies: `.md-header { background-color:
  # var(--md-primary-fg-color) }` -- which uritp.css points at `--u-chrome`.
  #
  # The two entries below still need to exist: the scheme TOGGLE needs two
  # palettes to switch between. That is now their ONLY job. First entry is the
  # default, so the site opens DARK.
  palette:
    - scheme: slate
      toggle:
        icon: material/circle-half-full
        name: Light
    - scheme: default
      toggle:
        icon: material/circle-outline
        name: Dark

  features:
    - navigation.sections    # sidebar groups instead of one flat list
    - navigation.expand      # no drilling: whole tree open on desktop
    - navigation.indexes     # a folder's index.md becomes its section landing page
    - navigation.top         # back-to-top button
    - toc.follow             # right rail tracks the scroll position
    - search.suggest         # autocomplete in the search box
    - content.tabs.link      # picking "Lighting" holds across the whole page

  # NOT here on purpose, do not add it back without reading why:
  #   content.action.edit -- puts a pencil at the TOP RIGHT of every page. It
  #   reads as an invitation to edit on a site whose job is to be the settled
  #   answer, and it renders as an anchor with NO TEXT, which a screen reader
  #   announces as a raw URL. hooks/pagefoot.py renders a worded link at the
  #   foot of the page instead. Removed 2026-08-01, Michael.

extra:
  generator: false          # hides the "Made with Material" footer line

  # ⚠️⚠️ `status:` IS A RESERVED MATERIAL KEY AND WE ALSO USE IT. READ THIS.
  #
  # hooks/visibility.py reads `status:` from page frontmatter to decide what
  # publishes. Material ALSO reads it, in partials/nav-item.html, and renders a
  # badge beside that page's title in the navigation:
  #
  #     {% if nav_item.meta and nav_item.meta.status %}
  #       {{ render_status(nav_item, nav_item.meta.status) }}
  #
  # It knows `new`, `deprecated` and `encrypted`; anything else gets the default
  # `information-outline` glyph. That collision was misdiagnosed as instant
  # previews on 2026-08-01 and cost a working feature -- see the markdown
  # extensions block at the bottom of this file.
  #
  # The badge is KEPT (Michael, 2026-08-01: "lost the info icon which i want
  # back"), and uritp.css -> NAV re-points `gated` at Material's shield-lock so
  # a locked page reads as locked from the sidebar.
  #
  # Only `public` and `gated` can ever appear here: `hidden` is never built and
  # `unlisted` is pruned from the nav. The other two are listed anyway so this
  # block stays a complete legend of our vocabulary rather than a partial one.
  #
  # ⚠️ Do NOT name a page `status: new` or `status: deprecated` to get a
  # different icon -- visibility.py treats an unrecognised value as `hidden`
  # and the page vanishes from the site entirely.
  #
  # These strings are the badge's `title=`, so they are hover text on a desktop
  # and an accessible name for a screen reader. A phone gets neither: there,
  # the glyph carries the whole meaning.
  status:
    public: Open to anyone with the link
    gated: Locked. Asks for a password
    unlisted: Not listed in navigation or search
    hidden: Not published

extra_css: [stylesheets/uritp.css, stylesheets/links.css]
extra_javascript: [javascripts/gate.js]   # client half of `status: gated`

plugins:
  - search        # must be listed: declaring plugins replaces the defaults
  - awesome-nav   # builds the sidebar from docs/, steered by docs/.nav.yml

# ORDER MATTERS for visibility -> links -> pagefoot. visibility.py drops
# `hidden` pages from the file list first, so links.py builds its id registry
# from pages that will actually exist; reverse those two and a link to a hidden
# page resolves to a 404. pagefoot.py appends after links.py so the edit link
# lands BELOW the `Linked from` section rather than between the body and it.
# theme.py runs FIRST because it writes theme.font into the config, which
# Material reads when it renders; buildstamp.py is order-independent.
hooks:
  - hooks/theme.py        # composes theme/*.tsv into --u-* tokens + theme.font
  - hooks/visibility.py   # frontmatter `status:` gate, hidden by default
  - hooks/links.py        # @page-id resolution, backlinks, retired-URL redirects
  - hooks/pagefoot.py     # "Edit this page on GitHub" at the page foot
  - hooks/buildstamp.py   # PR number in the site footer

# Each line below enables authoring syntax documented in AUTHORING.md.
markdown_extensions:
  - tables
  - admonition                                 # !!! warning "Title"
  - attr_list                                  # [To be confirmed]{.tbc} + {#anchor}
  - pymdownx.superfences                       # safe nesting inside tabs
  - pymdownx.tabbed: {alternate_style: true}   # === "Lighting"
  - toc: {permalink: true}

  # material.extensions.preview (instant previews) was REMOVED 2026-08-01.
  #
  # ⚠️ THE STATED REASON WAS WRONG AND IS CORRECTED HERE. The removal was
  # argued on two grounds: (a) previews need hover and phones have none, and
  # (b) the extension was putting an icon on every nav row. (b) IS FALSE. The
  # icons survived the removal untouched, and they were Material's `status:`
  # badge reading OUR OWN frontmatter -- see the `extra.status` block above.
  # Recorded because a wrong reason left in a config file is how the next
  # person re-derives it.
  #
  # (a) still stands on its own, so the removal STANDS: the primary reading
  # surface here is a phone, and a desktop-only hover card is not worth a
  # dependency. Adding it back is a live option and now costs nothing in nav
  # icons. Re-read AUTHORING-LOOK.md -> The chrome first.
