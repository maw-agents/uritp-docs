# THEME: everything about the look lives in the `theme/` folder as TSV grids.
#   Swap the whole site by editing ONE WORD in theme/active.txt. Nudge one
#   value by editing ONE CELL in the matching grid. Start at theme/README.md.
#   NOTHING about colour, type, edges or density is set in this file.
#   (theme.yml is a retired stub as of 2026-08-01 and is read by nothing.)
# STYLESHEETS: seven numbered sheets in docs/stylesheets/, one concern each.
#   Values in theme/*.tsv, RULES in the sheets, REASONS in CSS-NOTES.md.
# NAVIGATION: generated from the file tree. Order lives in docs/.nav.yml.
#   Shortcuts under Home live in quick-links.yml (see hooks/quicklinks.py).
# VISIBILITY: every page needs `status:` in its frontmatter or it will not build.
# LINKS: internal links are ids, not paths. See hooks/links.py + AUTHORING.md.
# SIZE: hooks/sizecheck.py fails the build on a file nobody can read whole.
#   Budgets are rows in size-budget.tsv.
#
# POINTER: adding or removing a markdown_extension changes what page authors can
#   write, and changing hooks/visibility.py changes what publishes. Update
#   AUTHORING.md in the SAME PR or it teaches rules the build no longer follows.

site_name: URITP PRP
site_url: https://maw-agents.github.io/uritp-docs/

# repo_url STAYS even though the GitHub block is hidden in the chrome (see
# docs/stylesheets/20-chrome.css). MkDocs builds `page.edit_url` from repo_url +
# edit_uri, and hooks/pagefoot.py renders that at the bottom of every page.
# Delete this line and the edit link silently disappears from the whole site.
repo_url: https://github.com/maw-agents/uritp-docs
edit_uri: edit/main/docs/
copyright: URITP | MAW

theme:
  name: material

  # ⚠️ NO `font:` BLOCK HERE ON PURPOSE, AND DO NOT ADD ONE BACK.
  #
  # hooks/theme.py SETS `theme.font` at build time from the `webfont-text` and
  # `webfont-code` columns of the active row in theme/typography.tsv. That is
  # the same row that decides which family the CSS asks for, so the family we
  # DOWNLOAD and the family we ASK FOR can no longer disagree.
  #
  # This closes a seam that was documented for weeks as unclosable: two files
  # naming the same font, kept in agreement by hand, where a mismatch produced
  # a silent fallback to the next entry in the stack with no error anywhere.
  # A `font:` block written here would be overwritten on every build, so it
  # would read as configuration while doing nothing at all.

  # 🔴 NO `primary:` KEY HERE EITHER, AND THIS ONE IS A TRAP. DO NOT ADD IT.
  #
  # `primary: black` sat here until 2026-08-01 and it was silently DEFEATING
  # the `chrome` colour token. Material special-cases black in
  # palette/_primary.scss: instead of only setting `--md-primary-fg-color`
  # (which our bridge overrides), it writes a LITERAL background on the
  # component, so no variable could reach the header at all. The banner was
  # hard black in BOTH modes.
  #
  # ⚠️ AND THE REASON THIS KEY WAS KEPT WAS FALSE -- it does NOT drive the
  # phone browser's theme-color. Full write-up, including what Material
  # actually reads: CSS-NOTES.md -> 00 Bridge.
  #
  # With no `primary`, no `[data-md-color-primary=...]` rule matches, and
  # Material's own default applies: `.md-header { background-color:
  # var(--md-primary-fg-color) }` -- which 00-bridge.css points at `--u-chrome`.
  #
  # The two entries below still need to exist: the scheme TOGGLE needs two
  # palettes to switch between. That is now their ONLY job. First entry is the
  # default, so the site opens DARK.
  palette:
    - scheme: slate
      toggle:
        icon: material/circle-half-full
        name: Light
    - scheme: default
      toggle:
        icon: material/circle-outline
        name: Dark

  features:
    # DEFAULT COLLAPSED (Michael, 2026-08-01). TWO features were removed to get
    #   here and BOTH had to go -- removing either one alone leaves the tree open,
    #   which is why this is a comment and not a deletion.
    #
    #   navigation.expand   -- forced every section open on desktop.
    #   navigation.sections -- rendered every TOP-LEVEL folder as a flat label
    #     group. Material draws that case with NO TOGGLE AT ALL, and a section
    #     label is only a link when the folder happens to carry an index.md.
    #     Most do not. That is the dead row Michael kept clicking: "folder titles
    #     that don't hold anything". Dropping the feature turns those rows into
    #     real expand/collapse toggles with a chevron, which is both a working
    #     click target and the visual difference between a folder and a page.
    #
    #   The ancestors of the page you are on still open by themselves, so a deep
    #   link never lands inside a closed tree.
    #
    #   This changes DESKTOP ONLY. The phone drawer always drilled down and is
    #   untouched by either feature.
    #
    #   PER-FOLDER DEFAULTS ARE NOT POSSIBLE FROM CONFIG. Material has no
    #   per-section expand key and awesome-nav has no expand feature at all, so
    #   "open Venues but collapse the rest" needs a custom_dir override of
    #   partials/nav-item.html. See CSS-NOTES.md -> 80 Mobile.
    - navigation.indexes     # a folder's index.md becomes its section landing page
    - navigation.top         # back-to-top button
    - toc.follow             # right rail tracks the scroll position
    - search.suggest         # autocomplete in the search box
    - content.tabs.link      # picking "Lighting" holds across the whole page

  # NOT here on purpose, do not add it back without reading why:
  #   content.action.edit -- puts a pencil at the TOP RIGHT of every page. It
  #   reads as an invitation to edit on a site whose job is to be the settled
  #   answer, and it renders as an anchor with NO TEXT, which a screen reader
  #   announces as a raw URL. hooks/pagefoot.py renders a worded link at the
  #   foot of the page instead. Removed 2026-08-01, Michael.

extra:
  generator: false          # hides the "Made with Material" footer line

  # ⚠️⚠️ `status:` IS A RESERVED MATERIAL KEY AND WE ALSO USE IT. READ THIS.
  #
  # hooks/visibility.py reads `status:` from page frontmatter to decide what
  # publishes. Material ALSO reads it, in partials/nav-item.html, and renders a
  # badge beside that page's title in the navigation:
  #
  #     {% if nav_item.meta and nav_item.meta.status %}
  #       {{ render_status(nav_item, nav_item.meta.status) }}
  #
  # It knows `new`, `deprecated` and `encrypted`; anything else gets the default
  # `information-outline` glyph. That collision was misdiagnosed as instant
  # previews on 2026-08-01 and cost a working feature -- see the markdown
  # extensions block at the bottom of this file.
  #
  # The badge is KEPT (Michael, 2026-08-01: "lost the info icon which i want
  # back"), and docs/stylesheets/20-chrome.css re-points `gated` at Material's
  # shield-lock so a locked page reads as locked from the sidebar.
  #
  # Only `public` and `gated` can ever appear here: `hidden` is never built and
  # `unlisted` is pruned from the nav. The other two are listed anyway so this
  # block stays a complete legend of our vocabulary rather than a partial one.
  #
  # ⚠️ Do NOT name a page `status: new` or `status: deprecated` to get a
  # different icon -- visibility.py treats an unrecognised value as `hidden`
  # and the page vanishes from the site entirely.
  #
  # These strings are the badge's `title=`, so they are hover text on a desktop
  # and an accessible name for a screen reader. A phone gets neither: there,
  # the glyph carries the whole meaning.
  #
  # ⚠️ A QUICK LINK CARRIES NO BADGE. hooks/quicklinks.py emits Link objects,
  # not Pages, and this template block only fires on a page's own meta. So the
  # same document shows an ⓘ or 🔒 in Venues and a bare label under Quick
  # Links. That is a real inconsistency and it is accepted: a shortcut bar is
  # about speed, and Material gives a Link no meta to read.
  status:
    public: Open to anyone with the link
    gated: Locked. Asks for a password
    unlisted: Not listed in navigation or search
    hidden: Not published

# ⚠️ THIS LIST IS THE CASCADE. The numbers are the order and the order is
#   load-bearing: 00 sets the tokens everything else reads, 90 must land last
#   or a print override gets overridden. REORDERING THIS LIST IS A SILENT
#   RESTYLE -- no error, no warning, just a different-looking site.
#
#   Split out of a single 34.9KB uritp.css on 2026-08-02. That file had crossed
#   the point where it could be read back whole, so its last ~6KB was being
#   edited blind. One concern per sheet; each one now reads whole, and
#   hooks/sizecheck.py keeps it that way. Why any given rule exists: CSS-NOTES.md
extra_css:
  - stylesheets/00-bridge.css       # tokens -> Material variables, focus ring
  - stylesheets/10-type.css         # the prose scale
  - stylesheets/20-chrome.css       # header, tabs, desktop sidebar
  - stylesheets/30-content.css      # tables, .tbc, callouts, tabs
  - stylesheets/40-components.css   # links, gate, page foot, build stamp
  - stylesheets/links.css           # @page-id link states (hooks/links.py)
  - stylesheets/80-mobile.css       # every breakpoint, both of them
  - stylesheets/90-print.css        # paper. MUST BE LAST.
extra_javascript: [javascripts/gate.js]   # client half of `status: gated`

plugins:
  - search        # must be listed: declaring plugins replaces the defaults
  - awesome-nav   # builds the sidebar from docs/, steered by docs/.nav.yml

# ORDER MATTERS in three places.
#
# theme.py FIRST: it writes theme.font into the config, which Material reads
# when it renders. contrast.py imports theme.py and reuses its grid reading, so
# it must come after -- and it measures what theme.py composed rather than
# re-deriving it, which is the only way the numbers can be trusted.
#
# visibility -> links -> pagefoot: visibility.py drops `hidden` pages from the
# file list first, so links.py builds its id registry from pages that will
# actually exist; reverse those two and a link to a hidden page resolves to a
# 404. pagefoot.py appends after links.py so the edit link lands BELOW the
# `Linked from` section rather than between the body and it. buildstamp.py is
# order-independent.
#
# links -> quicklinks: quicklinks.py resolves slugs out of the registry
# links.py publishes in its on_files, and files its misses into links.py's
# report before that hook writes it in on_post_build. Registered earlier, the
# Quick Links section would come up empty -- which the hook detects and warns
# about by name rather than shipping a silently missing sidebar section.
#
# sizecheck.py is order-independent: it reads the filesystem, not the config.
# Listed first anyway so a file that is too big to read stops the build in its
# first second rather than after a full render.
hooks:
  - hooks/sizecheck.py    # size-budget.tsv: no file nobody can read whole
  - hooks/theme.py        # composes theme/*.tsv into --u-* tokens + theme.font
  - hooks/contrast.py     # measures theme/contrast.tsv against every palette
  - hooks/visibility.py   # frontmatter `status:` gate, hidden by default
  - hooks/links.py        # @page-id resolution, backlinks, retired-URL redirects
  - hooks/quicklinks.py   # the Quick Links section, from quick-links.yml
  - hooks/pagefoot.py     # "Edit this page on GitHub" at the page foot
  - hooks/buildstamp.py   # PR number in the site footer

# Each line below enables authoring syntax documented in AUTHORING.md.
markdown_extensions:
  - tables
  - admonition                                 # !!! warning "Title"
  - pymdownx.details                           # ??? / ???+ collapsible callout
  - attr_list                                  # [To be confirmed]{.tbc} + {#anchor}
  - pymdownx.superfences                       # safe nesting inside tabs
  - pymdownx.tabbed: {alternate_style: true}   # === "Lighting"
  - toc: {permalink: true}

  # pymdownx.details ADDED 2026-08-01, Michael. It does one thing: it lets a
  # callout be written with ??? instead of !!! and renders that as a <details>
  # element the reader can fold shut. ???+ ships it open.
  #
  # It closed a REAL GAP THAT WAS RENDERING AS DEAD CSS: the stylesheet already
  # carried a full set of details/summary rules -- the same box, title bar and
  # body inset as .admonition, added when the callout spacing was fixed -- for a
  # component NO AUTHOR COULD PRODUCE, because the extension that emits it was
  # never enabled. Anyone typing ??? got three literal question marks. Styling
  # that outlives (or predates) the thing it styles is invisible in both
  # directions: the CSS looks used and the syntax looks supported.
  #
  # No new CSS shipped with it. That is the check that the rules were right.

  # material.extensions.preview (instant previews) was REMOVED 2026-08-01.
  #
  # ⚠️ THE STATED REASON WAS WRONG AND IS CORRECTED HERE. The removal was
  # argued on two grounds: (a) previews need hover and phones have none, and
  # (b) the extension was putting an icon on every nav row. (b) IS FALSE. The
  # icons survived the removal untouched, and they were Material's `status:`
  # badge reading OUR OWN frontmatter -- see the `extra.status` block above.
  # Recorded because a wrong reason left in a config file is how the next
  # person re-derives it.
  #
  # (a) still stands on its own, so the removal STANDS: the primary reading
  # surface here is a phone, and a desktop-only hover card is not worth a
  # dependency. Adding it back is a live option and now costs nothing in nav
  # icons. Re-read AUTHORING-LOOK.md -> The chrome first.
