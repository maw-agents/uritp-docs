# THEME SWAP: change theme.name. Nothing in docs/*.md is affected by a swap.
# NAVIGATION: generated from the file tree. Order lives in docs/.nav.yml, not here.
# VISIBILITY: every page needs `status:` in its frontmatter or it will not build.
# COLOR: brand color is theme.palette below, NOT uritp.css. See the note there.
#
# POINTER: adding or removing a markdown_extension changes what page authors can
#   write, and changing hooks/visibility.py changes what publishes. Update
#   AUTHORING.md in the SAME PR or it teaches rules the build no longer follows.

site_name: URITP Production Resources
site_url: https://maw-agents.github.io/uritp-docs/
repo_url: https://github.com/maw-agents/uritp-docs
edit_uri: edit/main/docs/
copyright: University of Rochester International Theatre Program

theme:
  name: material
  font: {text: DM Sans, code: IBM Plex Mono}

  # First entry is the default, so the site opens DARK.
  # `primary` and `accent` take Material's named colors, which is the whole
  # point of this block: the brand color is config, not CSS. Valid primary
  # names: red, pink, purple, deep purple, indigo, blue, light blue, cyan,
  # teal, green, light green, lime, yellow, amber, orange, deep orange,
  # brown, grey, blue grey, black, white.
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

  features:
    - navigation.sections    # sidebar groups instead of one flat list
    - navigation.top         # back-to-top button
    - toc.follow             # right rail tracks the scroll position
    - search.suggest         # autocomplete in the search box
    - content.action.edit    # pencil icon on every page
    - content.tabs.link      # picking "Lighting" holds across the whole page

extra_css: [stylesheets/uritp.css]
extra_javascript: [javascripts/gate.js]   # client half of `status: gated`
extra: {generator: false}                 # hides the "Made with Material" footer line

plugins:
  - search        # must be listed: declaring plugins replaces the defaults
  - awesome-nav   # builds the sidebar from docs/, steered by docs/.nav.yml

hooks:
  - hooks/visibility.py   # frontmatter `status:` gate, hidden by default
  - hooks/buildstamp.py   # deploy time + commit SHA in the footer

# Each line below enables authoring syntax documented in AUTHORING.md.
markdown_extensions:
  - tables
  - admonition                                 # !!! warning "Title"
  - attr_list                                  # [To be confirmed]{.tbc}
  - pymdownx.superfences                       # safe nesting inside tabs
  - pymdownx.tabbed: {alternate_style: true}   # === "Lighting"
  - toc: {permalink: true}
