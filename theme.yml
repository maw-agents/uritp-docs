# ══════════════════════════════════════════════════════════════════════════
#  VECTOR 2 — TYPOGRAPHY. The voice.
#
#  ⚠️ ONE SEAM WE CANNOT CLOSE, so it is named instead of hidden: this vector
#  sets which family the CSS ASKS FOR. Material owns DOWNLOADING the webfont,
#  via the `font` block in mkdocs.yml. Point at a family Material has not been
#  told to fetch and you get the fallback in the stack, silently. Change both,
#  or stay inside a family already loaded.
# ══════════════════════════════════════════════════════════════════════════

typography:

  plex-docs:
    note: The house voice. One family, hierarchy from weight and space rather than size.
    font-body:   "'IBM Plex Sans', system-ui, -apple-system, sans-serif"
    font-mono:   "'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    fs-body:     .78rem
    fs-lead:     .84rem
    fs-sm:       .75rem
    fs-xs:       .62rem
    fs-h1-min:   1.35rem
    fs-h1-fluid: 1.05rem + 1.4vw
    fs-h1-max:   1.72rem
    fs-h2:       1.02rem
    fs-h3:       .8rem
    lh-body:     1.62
    lh-tight:    1.2
    track-body:  0
    track-tight: -.014em
    track-caps:  .09em

  plex-large:
    note: Same family, everything up a step. For a phone at arm's length or a shop callboard.
    font-body:   "'IBM Plex Sans', system-ui, -apple-system, sans-serif"
    font-mono:   "'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    fs-body:     .88rem
    fs-lead:     .95rem
    fs-sm:       .84rem
    fs-xs:       .68rem
    fs-h1-min:   1.5rem
    fs-h1-fluid: 1.15rem + 1.6vw
    fs-h1-max:   2rem
    fs-h2:       1.14rem
    fs-h3:       .9rem
    lh-body:     1.66
    lh-tight:    1.22
    track-body:  0
    track-tight: -.012em
    track-caps:  .08em

  system-quick:
    note: "No webfont at all. Instant first paint on a bad connection; set the mkdocs.yml `font` block to false if you use it."
    font-body:   "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-mono:   "ui-monospace, SFMono-Regular, Menlo, monospace"
    fs-body:     .8rem
    fs-lead:     .86rem
    fs-sm:       .76rem
    fs-xs:       .63rem
    fs-h1-min:   1.35rem
    fs-h1-fluid: 1.05rem + 1.4vw
    fs-h1-max:   1.72rem
    fs-h2:       1.02rem
    fs-h3:       .8rem
    lh-body:     1.6
    lh-tight:    1.2
    track-body:  0
    track-tight: -.014em
    track-caps:  .09em


# ══════════════════════════════════════════════════════════════════════════
#  VECTOR 3 — FORMS.  "Which edges are mutable?"  These, and only these.
#
#  radius / radius-lg   corner rounding: small things / panels
#  border-w             a line you are meant to see
#  rule-w               a line you are meant to barely notice
#  shadow               depth. `none` is a real value and the house answer.
#  motion / ease        transition duration + curve (wrapped by prefers-reduced-motion)
#  focus-w              thickness of the keyboard focus ring. Never 0.
# ══════════════════════════════════════════════════════════════════════════

forms:

  hairline:
    note: The house feel. Barely-rounded, flat, one-pixel rules. A reference database, not a card UI.
    radius:    3px
    radius-lg: 4px
    border-w:  1px
    rule-w:    1px
    shadow:    none
    motion:    120ms
    ease:      cubic-bezier(.2,.7,.2,1)
    focus-w:   2px

  square:
    note: No rounding anywhere. Reads as a printed form.
    radius:    0
    radius-lg: 0
    border-w:  1px
    rule-w:    1px
    shadow:    none
    motion:    100ms
    ease:      cubic-bezier(.2,.7,.2,1)
    focus-w:   2px

  soft:
    note: Rounded and lifted, the ClickUp_apps `soft` feel. Included so the difference is visible, not because this site wants it.
    radius:    8px
    radius-lg: 12px
    border-w:  1px
    rule-w:    1px
    shadow:    0 2px 8px rgba(0,0,0,.18)
    motion:    150ms
    ease:      cubic-bezier(.16,1,.3,1)
    focus-w:   2px


# ══════════════════════════════════════════════════════════════════════════
#  VECTOR 4 — SPACING. The density.
#
#  touch      minimum tap target. 44px is the accessibility floor; do not go under.
#  pad-cell   table cell padding
#  pad-block  padding inside a callout / the gate box
#  gap-*      the rhythm between things
#  measure    maximum line length for prose
# ══════════════════════════════════════════════════════════════════════════

spacing:

  standard:
    note: The house density.
    touch:     44px
    pad-cell:  .5rem
    pad-block: .7rem
    gap-xs:    .2rem
    gap-md:    .85rem
    gap-lg:    2.1rem
    measure:   68ch

  dense:
    note: Tighter. More rows on screen, less air.
    touch:     44px
    pad-cell:  .34rem
    pad-block: .55rem
    gap-xs:    .14rem
    gap-md:    .65rem
    gap-lg:    1.6rem
    measure:   76ch

  roomy:
    note: More air. Easier at distance and on a phone in a dark theatre.
    touch:     48px
    pad-cell:  .68rem
    pad-block: .95rem
    gap-xs:    .28rem
    gap-md:    1.05rem
    gap-lg:    2.6rem
    measure:   62ch
