# ══════════════════════════════════════════════════════════════════════════
#  URITP DOCS — THEME VECTORS
#
#  A theme here is not a stylesheet. It is FOUR independent choices:
#
#        colour  ×  typography  ×  forms  ×  spacing
#
#  Ported from mawizorek/ClickUp_apps -> shared/themes/ (the 4-vector matrix
#  every ClickUp app build points at) so the same vocabulary works in both
#  places. Token NAMES match that system wherever the concept exists.
#
#  ┌──────────────────────────────────────────────────────────────────────┐
#  │  TO RESKIN THE WHOLE SITE, CHANGE THE ONE LINE BELOW.                │
#  │  No second file. No CSS. No stylesheet swap.                         │
#  └──────────────────────────────────────────────────────────────────────┘

active: uritp-prp

#  Read by hooks/theme.py, which composes the four vectors into --u-* custom
#  properties and injects them into every page's <head>. docs/stylesheets/
#  uritp.css consumes those tokens and contains no literal colour, font, size
#  or radius of its own. Documented in AUTHORING-LOOK.md.
#
#  A name that does not resolve FAILS THE BUILD, on purpose. Unlike a dead
#  link or a missing gate key, a theme has no page to fail locally on, and a
#  theme that silently fell back to something else is a defect nobody notices.
#  Every PR runs a build check, so a typo is caught on the branch.
#
#  ⚠️ EDITING THIS FILE: a `note:` is a plain YAML scalar and MUST NOT contain
#  a colon followed by a space. `set theme.font: false` reads as a nested
#  mapping and fails the whole parse with a message that points at the wrong
#  line. Quote the value or reword it. This cost one build on 2026-08-01.


# ══════════════════════════════════════════════════════════════════════════
#  THE JOIN TABLE — named combinations. This is the menu `active:` picks from.
# ══════════════════════════════════════════════════════════════════════════

themes:

  uritp-prp:
    note: The house look. Neutral slate, one owned blue, hairline rules.
    color: uritp-prp
    typography: plex-docs
    forms: hairline
    spacing: standard

  uritp-prp-large:
    note: Same skin, bigger type and more air. For a callboard screen or anyone reading at arm's length.
    color: uritp-prp
    typography: plex-large
    forms: hairline
    spacing: roomy

  utility:
    note: The ClickUp_apps anchor palette (maw-dark-utility), teal accent. Proves the vocabulary transfers.
    color: maw-dark-utility
    typography: plex-docs
    forms: hairline
    spacing: standard

  paper:
    note: High-contrast greyscale, squared edges, roomy. Closest to a printed document.
    color: paper-mono
    typography: plex-docs
    forms: square
    spacing: roomy


# ══════════════════════════════════════════════════════════════════════════
#  VECTOR 1 — COLOUR.  "What colours do I have to design with?"  This is it.
#
#  Every palette declares BOTH modes, because a docs site has a dark/light
#  toggle and a one-mode palette would half-work. That is this port's one
#  addition to the ClickUp_apps colour schema.
#
#  bg          the page
#  surface-1   code blocks, inset panels
#  surface-2   raised strips: callout headers, table row hover
#  border      a line you are meant to SEE (inputs, table header underline)
#  hairline    a line you are meant to barely notice (row rules, dividers)
#  text        body copy
#  text-strong headings, the first cell of a table row
#  text-soft   ledes, captions, the small uppercase labels
#  accent      links, the active nav item, focus rings.  ONE colour, owned.
#  accent-hover  its hover/press state
#  on-accent   text sitting ON an accent fill (the Unlock button)
#  chrome      ⭐ THE HEADER BANNER, and the drawer header on a phone. THIS IS
#              THE ONE LINE for "make the top bar a different colour", and it
#              is the whole reason the token exists. Every palette below sets
#              it EQUAL TO bg, which is the deliberate flat house look: the
#              header is the same ground as the page, separated by a rule
#              rather than a block of colour. Give it a different value and
#              the banner detaches from the page. If you take it somewhere far
#              from a dark neutral, mirror it in mkdocs.yml -> theme.palette
#              -> primary, which is the first-paint floor and the source of
#              the mobile browser's own <meta theme-color>.
#  on-chrome   text and icons sitting on the chrome
#  marker      [To be confirmed]{.tbc} and the gate label. Deliberately not the accent.
#  bad         dead links, errors
# ══════════════════════════════════════════════════════════════════════════

color:

  uritp-prp:
    note: The house palette. Cool near-neutral slate; the blue is a real choice now, not Material's leftover default.
    dark:
      bg:           oklch(19% 0.008 250)
      surface-1:    oklch(24% 0.008 250)
      surface-2:    oklch(22% 0.008 250)
      border:       oklch(46% 0.008 250)
      hairline:     oklch(30% 0.008 250)
      text:         oklch(80% 0.006 250)
      text-strong:  oklch(95% 0.003 250)
      text-soft:    oklch(64% 0.008 250)
      accent:       oklch(74% 0.110 240)
      accent-hover: oklch(85% 0.095 240)
      on-accent:    oklch(19% 0.020 240)
      chrome:       oklch(19% 0.008 250)
      on-chrome:    oklch(95% 0.003 250)
      marker:       oklch(76% 0.100 70)
      bad:          oklch(72% 0.150 25)
    light:
      bg:           oklch(99% 0.002 250)
      surface-1:    oklch(96.5% 0.004 250)
      surface-2:    oklch(97.3% 0.003 250)
      border:       oklch(72% 0.006 250)
      hairline:     oklch(90% 0.004 250)
      text:         oklch(34% 0.008 250)
      text-strong:  oklch(18% 0.010 250)
      text-soft:    oklch(52% 0.008 250)
      accent:       oklch(47% 0.150 250)
      accent-hover: oklch(37% 0.160 250)
      on-accent:    oklch(99% 0.002 250)
      chrome:       oklch(99% 0.002 250)
      on-chrome:    oklch(18% 0.010 250)
      marker:       oklch(48% 0.110 65)
      bad:          oklch(56% 0.170 25)

  maw-dark-utility:
    note: >-
      The anchor palette from ClickUp_apps/shared/themes/maw-dark-utility.json.
      Dark values are that file's tokens verbatim. The light mode is authored
      here: the original is dark-only, and a docs site cannot be.
    dark:
      bg:           oklch(20% 0.010 260)
      surface-1:    oklch(24.5% 0.014 260)
      surface-2:    oklch(28.5% 0.016 260)
      border:       oklch(44% 0.020 260)
      hairline:     oklch(31% 0.018 260)
      text:         oklch(88% 0.008 260)
      text-strong:  oklch(95% 0.008 260)
      text-soft:    oklch(72% 0.012 260)
      accent:       oklch(72% 0.110 205)
      accent-hover: oklch(80% 0.090 195)
      on-accent:    oklch(20% 0.020 205)
      chrome:       oklch(20% 0.010 260)
      on-chrome:    oklch(95% 0.008 260)
      marker:       oklch(80% 0.130 80)
      bad:          oklch(62% 0.200 25)
    light:
      bg:           oklch(98.5% 0.003 260)
      surface-1:    oklch(95.5% 0.006 260)
      surface-2:    oklch(96.5% 0.005 260)
      border:       oklch(70% 0.012 260)
      hairline:     oklch(89% 0.006 260)
      text:         oklch(33% 0.012 260)
      text-strong:  oklch(17% 0.014 260)
      text-soft:    oklch(51% 0.012 260)
      accent:       oklch(45% 0.110 205)
      accent-hover: oklch(36% 0.115 205)
      on-accent:    oklch(98.5% 0.003 260)
