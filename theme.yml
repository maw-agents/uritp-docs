  paper-mono:
    note: Greyscale, maximum contrast, no hue anywhere except the two signal colours. For long reading and for anything that gets printed.
    dark:
      bg:           oklch(16% 0 0)
      surface-1:    oklch(22% 0 0)
      surface-2:    oklch(20% 0 0)
      border:       oklch(50% 0 0)
      hairline:     oklch(30% 0 0)
      text:         oklch(86% 0 0)
      text-strong:  oklch(98% 0 0)
      text-soft:    oklch(66% 0 0)
      accent:       oklch(88% 0 0)
      accent-hover: oklch(98% 0 0)
