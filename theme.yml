#  The theme moved to  ->  theme/  (a folder of TSV grids)
#
#      theme/active.txt      the switch. one word.
#      theme/themes.tsv      the join table. one row per theme.
#      theme/colors.tsv      colour, one row per palette per mode
#      theme/typography.tsv  type
#      theme/forms.tsv       edges
#      theme/spacing.tsv     density
#      theme/README.md       how to edit all of it
#
#  WHY, in Michael's words: he wanted "files accessible at face value so all
#  edits needn't be done directly in source code, more like editing data
#  files." A TSV opens as a grid anywhere. Nested YAML is a document where
#  indentation is load-bearing -- and this very file cost a build on the day
#  it shipped, because a `note:` contained a colon followed by a space.
#
